name: LinkedIn Probe

# A measurement, not a scan: with at most 90 requests it checks whether LinkedIn can be watched per
# city (one list of everything new, matched against every candidate) instead of per person.
# It reads no candidate and sends nothing. Run it by hand: Actions -> LinkedIn Probe -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Measure
        run: python tools/linkedin_probe.py
