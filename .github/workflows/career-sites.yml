name: Career Sites

# Reads the companies' own career sites and job boards (see PORTALS in company_portals.py) and mails
# each candidate their new openings, each opening once.
#
# One job does it for everyone: every site is read a single time, then each candidate is judged
# against what was read. The reading does not grow with the number of candidates, so this scan has
# no practical limit on how many people it serves.
#
# A candidate is mailed when a new opening is in one of their cities (or remote in India, when they
# allow it), is one of their roles, is full-time, and asks for experience that includes their years.
# A posting that states no years is listed apart, and only at the candidate's skill match or more.
#
# hourly-timer.yml starts this once an hour, after it has started the LinkedIn report.
# To start it by hand: Actions -> Career Sites -> Run workflow ("dry_run" sends nothing).

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional candidate ids, comma-separated; empty = every enabled candidate'
        required: false
        default: ''
      companies:
        description: 'Optional comma-separated companies by key (for example infosys,amazon,okta,paytm; all keys are in company_portals.py); empty = each candidate''s own list'
        required: false
        default: ''
      dry_run:
        description: 'Scan and log only: send nothing, remember nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One scan at a time; a second one waits, so the same opening is never mailed twice.
concurrency:
  group: career-sites
  cancel-in-progress: false

env:
  DATA_REPO: ${{ github.repository_owner }}/${{ vars.DATA_REPO || 'job-alerts-data' }}

jobs:
  scan:
    name: Scan for every candidate
    runs-on: ubuntu-latest
    # Reading 78 sources takes about 4 minutes; each candidate adds a few seconds.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the candidates' settings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: candidates-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # What each candidate has already been judged against and mailed: one file per candidate, handed from run to run.
      - name: Restore scan history
        uses: actions/cache/restore@v4
        with:
          path: data/portal_state
          key: sites-all-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sites-all-v1-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Read every site once, then judge and mail each candidate
        timeout-minutes: 110
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional free AI reader of postings (brain.py); with neither key set the built-in rules are used alone.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAIN_GEMINI_MODELS: ${{ vars.BRAIN_GEMINI_MODELS }}
          BRAIN_GROQ_MODELS: ${{ vars.BRAIN_GROQ_MODELS }}
          # Inputs go through the environment, not straight into the script text.
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_COMPANIES: ${{ inputs.companies }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--all candidates-data)
          if [ -n "$INPUT_ONLY" ]; then
            ARGS+=(--only "$INPUT_ONLY")
          fi
          if [ -n "$INPUT_COMPANIES" ]; then
            ARGS+=(--companies "$INPUT_COMPANIES")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python company_portals.py "${ARGS[@]}"

      - name: Save scan history
        # Also after a failed scan, so an opening that was mailed is never mailed twice.
        if: ${{ !cancelled() && hashFiles('data/portal_state/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/portal_state
          key: sites-all-v1-${{ github.run_id }}-${{ github.run_attempt }}
