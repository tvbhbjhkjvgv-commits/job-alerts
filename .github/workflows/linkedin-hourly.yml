name: LinkedIn Hourly

# The hourly LinkedIn report, once for every candidate.
#
#   candidates : reads the candidates' settings (a private repository) and lists who is scanned.
#   search     : one worker per candidate and place searches LinkedIn and reads the job descriptions.
#   report     : one job per candidate filters, scores and mails that candidate's new matches.
#
# Only candidate ids appear in job names and logs; names and addresses stay in the private files.
# hourly-timer.yml starts this once an hour. To start it by hand: Actions -> LinkedIn Hourly -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Posting age window in hours (default 1)'
        required: false
        default: '1'
      only:
        description: 'Optional candidate ids, comma-separated; empty = every enabled candidate'
        required: false
        default: ''

permissions:
  contents: read

# One run at a time; a second one waits, so no opening is mailed twice.
concurrency:
  group: linkedin-hourly
  cancel-in-progress: false

env:
  DATA_REPO: ${{ github.repository_owner }}/${{ vars.DATA_REPO || 'job-alerts-data' }}

jobs:
  candidates:
    name: List candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      searches: ${{ steps.list.outputs.linkedin_searches }}
      reports: ${{ steps.list.outputs.linkedin }}
      count: ${{ steps.list.outputs.linkedin_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the candidates' settings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: candidates-data

      - name: List the candidates
        id: list
        env:
          INPUT_ONLY: ${{ inputs.only }}
        run: python3 tools/matrix.py candidates-data --only "$INPUT_ONLY" >> "$GITHUB_OUTPUT"

  search:
    name: Search ${{ matrix.id }} ${{ matrix.slug }}
    needs: candidates
    if: ${{ needs.candidates.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.candidates.outputs.searches) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the candidates' settings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: candidates-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Search LinkedIn and read job descriptions
        env:
          LINKEDIN_PROXY: ${{ secrets.LINKEDIN_PROXY }}
          SEARCH_BUDGET_SECONDS: '540'
          CANDIDATE_PROFILE: candidates-data/candidates/${{ matrix.id }}.json
          SEARCH_PLACE: ${{ matrix.place }}
          SHARD: ${{ matrix.slug }}
          INPUT_HOURS: ${{ inputs.hours || '1' }}
        run: |
          python job_match_runner.py --collect-only --source guest --location "$SEARCH_PLACE" \
            --output "shards/$SHARD.json" --hours "$INPUT_HOURS" --target-count 0

      - name: Hand the jobs to the report job
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.id }}-${{ matrix.slug }}
          path: shards/*.json
          if-no-files-found: error
          retention-days: 1

  report:
    name: Report ${{ matrix.id }}
    needs: [candidates, search]
    if: ${{ !cancelled() && needs.candidates.result == 'success' && needs.candidates.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.candidates.outputs.reports) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the candidates' settings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: candidates-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # What this candidate has already been sent, handed from run to run.
      - name: Restore seen-job history
        uses: actions/cache/restore@v4
        with:
          path: data/seen_job_ids.json
          key: seen-v1-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-v1-${{ matrix.id }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect this candidate's search results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-${{ matrix.id }}-*
          path: shards
          merge-multiple: true

      - name: Filter, score and mail
        env:
          LINKEDIN_PROXY: ${{ secrets.LINKEDIN_PROXY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_PROFILE: candidates-data/candidates/${{ matrix.id }}.json
          INPUT_HOURS: ${{ inputs.hours || '1' }}
        run: |
          mkdir -p shards
          python job_match_runner.py --from-shards shards --hours "$INPUT_HOURS" --target-count 0

      - name: Save seen-job history
        if: ${{ !cancelled() && hashFiles('data/seen_job_ids.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/seen_job_ids.json
          key: seen-v1-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
