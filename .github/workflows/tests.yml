name: Tests

# Offline checks of the filters, the score and the notification paths. Nothing here contacts
# LinkedIn, Gmail or ntfy. Runs on every change to the script or the tests, and on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - 'job_match_runner.py'
      - 'company_portals.py'
      - 'brain.py'
      - 'tools/**'
      - 'docs/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Experience rule (200 hand-written postings)
        run: python tests/test_experience.py

      - name: Role fit, score, duplicates, search workers
        run: python tests/test_role_fit.py

      - name: Report, email and failure paths
        run: python tests/test_pipeline.py

      - name: Hyderabad fast alert
        run: python tests/test_fast_alert.py

      - name: Company career sites
        run: python tests/test_company_portals.py

      - name: Candidate profiles and the candidate list
        run: python tests/test_profiles.py

      - name: AI reader of postings (no model is contacted)
        run: python tests/test_brain.py

      - name: Settings page (resume reading)
        run: node tests/test_page.js
